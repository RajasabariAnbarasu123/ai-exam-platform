# ============================================
# DEV ENVIRONMENT CONFIGURATION
# ============================================
spring.profiles.active=dev

# Database Configuration - Development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examdb_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration - Development
logging.level.com.aiexam=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration - Development
security.require-ssl=false
security.enable-csrf=false
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# Rate Limiting - Development (higher limits for testing)
rate.limit.requests-per-minute=1000
rate.limit.requests-per-second=100

# App Configuration - Development
app.url=http://localhost:3000
app.debug=true

# Email Configuration - Development (use console output)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.properties.mail.debug=true

# OpenAI Configuration - Development
openai.api.timeout=300000
openai.api.retry-count=1

# Actuator - Development (full exposure)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger - Development (enabled)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# CORS - Development (allow all)
spring.web.cors.allowed-origins=*