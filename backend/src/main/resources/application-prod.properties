# ============================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ============================================
spring.profiles.active=prod

# Database Configuration - Production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create

# Connection Pool - Production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration - Production
logging.level.com.aiexam=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=INFO
logging.file.name=/var/log/aiexam/application.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=10GB

# Security Configuration - Production
security.require-ssl=true
security.enable-csrf=true
security.cors.allowed-origins=${ALLOWED_ORIGINS}

# Rate Limiting - Production (strict)
rate.limit.requests-per-minute=60
rate.limit.requests-per-second=10
rate.limit.requests-per-hour=300

# App Configuration - Production
app.url=${APP_URL}
app.debug=false

# Email Configuration - Production
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OpenAI Configuration - Production
openai.api.timeout=300000
openai.api.retry-count=3
openai.api.retry-delay=5000

# Actuator - Production (secure exposure)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.info.enabled=true

# Swagger - Production (disabled)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# CORS - Production (restricted)
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allow-credentials=true

# Cache Configuration - Production
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml

# Session - Production
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# SSL - Production
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_KEY_PASSWORD}
server.ssl.key-alias=${SSL_KEY_ALIAS}
server.ssl.key-store-type=PKCS12

# Performance - Production
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=200