# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=AI-Exam-Platform
# Set to 'default' when your Supabase project is active and reachable
spring.profiles.active=default
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Supabase PostgreSQL (used when spring.profiles.active is NOT 'local')
# NOTE: If your Supabase project is paused, go to https://supabase.com/dashboard
# and click 'Resume' before switching to the default profile.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
# NOTE: Tables are created via db/migration/init_schema.sql - run that script in Supabase SQL Editor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${REFRESH_TOKEN_EXPIRATION:604800000}

# ============================================
# OPENAI CONFIGURATION
# ============================================

openai.api.key=${OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL}
openai.api.model=${OPENAI_MODEL}
openai.api.max-tokens=16000
openai.api.temperature=0.7
openai.api.timeout=600000
openai.api.retry-count=3
openai.api.retry-delay=2000

# ============================================
# EMAIL CONFIGURATION
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# ============================================
# APP CONFIGURATION
# ============================================
app.url=${APP_URL:http://localhost:3000}
app.name=AI Exam Platform
app.support-email=support@aiexam.com
app.version=1.0.0

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=/tmp

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.aiexam=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache.type=simple
spring.cache.cache-names=exam,user,dashboard
spring.cache.simple.cache-names=exam,user,dashboard

# ============================================
# RATE LIMITING CONFIGURATION
# ============================================
rate.limit.enabled=true
rate.limit.requests-per-minute=100
rate.limit.requests-per-second=10
rate.limit.requests-per-hour=600

# ============================================
# SECURITY CONFIGURATION
# ============================================
security.require-ssl=${REQUIRE_SSL:false}
security.enable-csrf=false
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
security.cors.exposed-headers=Authorization
security.cors.allow-credentials=true
security.cors.max-age=3600

# ============================================
# TASK EXECUTION CONFIGURATION
# ============================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=exam-task-
spring.task.execution.pool.keep-alive=60s

# ============================================
# SCHEDULING CONFIGURATION
# ============================================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

# ============================================
# ACTUATOR CONFIGURATION (for monitoring)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=false
management.info.env.enabled=true

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-model-expand-depth=0
springdoc.show-actuator=true

# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# ============================================
# SESSION CONFIGURATION
# ============================================
spring.session.store-type=none
spring.session.timeout=30m

# ============================================
# CORS CONFIGURATION
# ============================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ============================================
# HTTP CONFIGURATION
# ============================================
server.tomcat.connection-timeout=600000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.uri-encoding=UTF-8
server.tomcat.max-http-header-size=8192